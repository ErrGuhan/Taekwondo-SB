<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Taekwondo Scoring — Login</title>
  <meta name="description" content="Operator login for the Taekwondo live scoring system." />
  <!-- Security meta tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="DENY" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/theme.css" />
  <style>
    /* ── Login Card ──────────────────────────────────────────────────────────── */
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: var(--sp-7) var(--sp-6);
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      position: relative;
    }

    /* ── Logo Mark ────────────────────────────────────────────────────────────── */
    .logo-mark {
      width: 60px; height: 60px;
      background: linear-gradient(135deg, var(--amber), var(--amber-dark));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 0 32px var(--amber-glow);
      margin: 0 auto var(--sp-4) auto;
    }

    .login-title {
      font-size: clamp(1.4rem, 5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      text-align: center;
    }
    .login-subtitle {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: var(--sp-6);
      text-align: center;
    }

    .login-form { display: flex; flex-direction: column; gap: var(--sp-4); text-align: left; }

    /* Password field wrapper with toggle */
    .password-wrapper {
      position: relative;
    }
    .password-wrapper input {
      padding-right: 48px;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      min-height: unset;
      min-width: unset;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 150ms;
    }
    .password-toggle:hover { color: var(--text-muted); }

    .toggle-mode {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
    .badge {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
      margin: var(--sp-6) auto 0 auto;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .badge svg { opacity: 0.4; }

    /* ── Mobile adjustments ──────────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card {
        padding: var(--sp-6) var(--sp-5);
        border-radius: var(--r-md);
        max-width: 100%;
      }
      .page-center {
        padding: var(--sp-4);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
      }
    }

    /* ── Laptop / Desktop (> 1024px) ─────────────────────────────────────────── */
    @media (min-width: 1024px) {
      .login-card { max-width: 440px; }
      .page-center {
        background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(245,197,24,0.05) 0%, transparent 70%), var(--bg);
      }
    }
  </style>
</head>
<body>
  <div class="page-center">
    <div class="glass login-card flex-col">
      <div class="logo-mark" role="img" aria-label="Taekwondo Scoring">🥋</div>
      <h1 class="login-title" id="page-title">Operator Login</h1>
      <p class="login-subtitle" id="page-subtitle">Sign in to score a match</p>

      <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>

      <form class="login-form" id="login-form" novalidate autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="operator@club.com"
            required
            autocomplete="email"
            inputmode="email"
            spellcheck="false"
            autocapitalize="none"
          />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
              minlength="6"
            />
            <button
              type="button"
              class="password-toggle"
              id="pw-toggle"
              aria-label="Show password"
              title="Show / hide password"
            >
              <span id="pw-toggle-icon" aria-hidden="true">👁</span>
            </button>
          </div>
        </div>
        <button type="submit" class="clay clay--amber clay--lg clay--block" id="submit-btn">
          Sign In
        </button>
      </form>

      <p class="toggle-mode" style="margin-top: var(--sp-4);">
        No account?
        <button class="link" id="toggle-btn" type="button">Create one</button>
      </p>

      <div class="badge" style="display:flex; justify-content:center; gap:8px;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e;" aria-hidden="true"></span>
        <span>Live Cloud Connected</span>
      </div>
    </div>
  </div>

  <script type="module" src="./lib/notification-drawer.js"></script>
  <script type="module" src="./pages/login/login.js"></script>
  <script>
    // Password visibility toggle
    const pwToggle = document.getElementById('pw-toggle');
    const pwInput  = document.getElementById('password');
    const pwIcon   = document.getElementById('pw-toggle-icon');
    if (pwToggle && pwInput) {
      pwToggle.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        pwIcon.textContent = isHidden ? '🙈' : '👁';
        pwToggle.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    }
  </script>
</body>
</html>
