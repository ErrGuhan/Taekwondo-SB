<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taekwondo Scoring — Login</title>
  <meta name="description" content="Operator login for the Taekwondo live scoring system." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="./styles/reset.css" />
  <link rel="stylesheet" href="./styles/theme.css" />
  <style>
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: var(--sp-7) var(--sp-6);
    }
    .logo-mark {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--amber), var(--amber-dark));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 30px var(--amber-glow);
      margin-bottom: var(--sp-5);
    }
    .login-title { font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    .login-subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: var(--sp-6); }
    .login-form { display: flex; flex-direction: column; gap: var(--sp-4); }
    .error-msg {
      color: #F87171;
      font-size: 0.85rem;
      padding: 10px 14px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.2);
      border-radius: var(--r-sm);
      display: none;
    }
    .error-msg--show { display: block; }
    .error-msg--success {
      color: #4ADE80 !important;
      background: rgba(74,222,128,0.1) !important;
      border-color: rgba(74,222,128,0.25) !important;
    }
    .toggle-mode { font-size: 0.85rem; color: var(--text-muted); text-align: center; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
      margin-top: var(--sp-8);
    }
    .badge svg { opacity: 0.4; }
  </style>
</head>
<body>
  <div class="page-center">
    <div class="glass login-card flex-col">
      <div class="logo-mark">🥋</div>
      <h1 class="login-title" id="page-title">Operator Login</h1>
      <p class="login-subtitle" id="page-subtitle">Sign in to score a match</p>

      <div id="error-msg" class="error-msg" role="alert"></div>

      <form class="login-form" id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="operator@club.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" minlength="6" />
        </div>
        <button type="submit" class="clay clay--amber clay--lg clay--block" id="submit-btn">
          Sign In
        </button>
      </form>

      <p class="toggle-mode" style="margin-top: var(--sp-4);">
        No account?
        <button class="link" id="toggle-btn" type="button">Create one</button>
      </p>

      <div class="badge" style="display:flex; justify-content:center; gap:8px;">
        <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 8px #22c55e;"></span>
        <span>Live Cloud Connected</span>
      </div>
    </div>
  </div>

  <script type="module" src="./pages/login/login.js"></script>
</body>
</html>
