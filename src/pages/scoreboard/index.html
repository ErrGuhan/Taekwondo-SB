<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Scoreboard — Taekwondo</title>
  <meta name="description" content="Live Taekwondo match scoreboard venue display." />
  <!-- Security meta tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Share+Tech+Mono&display=swap" />
  <link rel="stylesheet" href="../../styles/reset.css" />
  <link rel="stylesheet" href="../../styles/theme.css" />
  <style>
    /* Full viewport venue display */
    body {
      background: var(--bg);
      overflow: hidden;
      margin: 0;
      padding: 0;
      color: #F5F6F8;
      font-family: var(--font-body);
    }

    .sb-root {
      display: flex;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      box-sizing: border-box;
      background: #0B0D12;
      overflow: hidden;
    }

    /* ── Corner Sections ───────────────────────────────────────────────────── */
    .sb-corner {
      flex: 1 1 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: clamp(20px, 3.5vw, 48px) clamp(24px, 4vw, 56px);
      min-width: 0;
      box-sizing: border-box;
      position: relative;
      contain: layout style;
    }

    .sb-corner--red {
      background: linear-gradient(160deg, #7A0F22 0%, #0B0D12 65%);
      border-top: 5px solid #C81E3A;
    }

    .sb-corner--blue {
      background: linear-gradient(200deg, #0F2E7A 0%, #0B0D12 65%);
      border-top: 5px solid #1E5FC8;
    }

    /* Top Corner Header */
    .sb-corner-top {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      white-space: nowrap;
    }
    .sb-corner--red .sb-corner-top  { justify-content: flex-start; }
    .sb-corner--blue .sb-corner-top { justify-content: flex-end; }

    .sb-name {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: clamp(18px, 2.8vw, 42px);
      letter-spacing: 0.01em;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
    }

    .sb-country-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: clamp(11px, 1.2vw, 17px);
      font-weight: 800;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.20);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      text-transform: uppercase;
      min-width: 44px;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    /* Center Score Container */
    .sb-corner-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vh, 24px);
      padding: 12px 0;
      min-width: 0;
    }

    .sb-score {
      font-family: var(--font-display);
      font-weight: 800;
      line-height: 1;
      color: #F5F6F8;
      font-size: clamp(64px, 12vw, 172px);
      text-shadow: 0 0 45px rgba(255,255,255,0.18);
      user-select: none;
      transition: transform 140ms cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-origin: center center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      contain: layout style;
      white-space: nowrap;
    }

    .sb-corner--red .sb-score  { text-shadow: 0 0 50px rgba(200, 30, 58, 0.45); }
    .sb-corner--blue .sb-score { text-shadow: 0 0 50px rgba(30, 95, 200, 0.45); }

    /* Round Pills Row */
    .sb-round-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .sb-chip {
      min-width: 36px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.10);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #9AA3B8;
      transition: all 250ms ease;
    }

    .sb-chip--red-won {
      background: rgba(200,30,58,0.25);
      border-color: #C81E3A;
      color: #FF6B82;
      box-shadow: 0 0 10px rgba(200,30,58,0.3);
    }

    .sb-chip--blue-won {
      background: rgba(30,95,200,0.25);
      border-color: #1E5FC8;
      color: #7BB2FF;
      box-shadow: 0 0 10px rgba(30,95,200,0.3);
    }

    .sb-chip--active {
      border-color: var(--amber);
      color: var(--amber);
    }

    /* VR & Doctor Badges */
    .sb-badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .sb-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #9AA3B8;
      white-space: nowrap;
    }

    .sb-badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #3DDC84;
      display: inline-block;
    }

    .sb-badge--used {
      opacity: 0.35;
      text-decoration: line-through;
    }
    .sb-badge--used .sb-badge-dot { background: #EF4444; }

    /* Bottom Gam-Jeom Row */
    .sb-corner-bottom {
      display: flex;
      align-items: center;
    }
    .sb-corner--red .sb-corner-bottom  { justify-content: flex-start; }
    .sb-corner--blue .sb-corner-bottom { justify-content: flex-end; }

    .sb-gj-box {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 8px;
    }

    .sb-gj-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: #9AA3B8;
      text-transform: uppercase;
    }

    .sb-gj-num {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(18px, 2vw, 28px);
      min-width: 1.2ch;
      text-align: center;
      color: #F5F6F8;
    }

    /* ── Center Column ─────────────────────────────────────────────────────── */
    .sb-center {
      flex: 0 0 clamp(240px, 20vw, 320px);
      width: clamp(240px, 20vw, 320px);
      min-width: clamp(240px, 20vw, 320px);
      max-width: clamp(240px, 20vw, 320px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(20px, 3vh, 44px) clamp(12px, 1.8vw, 24px);
      box-sizing: border-box;
      text-align: center;
      border-left: 1px solid rgba(255,255,255,0.08);
      border-right: 1px solid rgba(255,255,255,0.08);
      background: rgba(11, 13, 18, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      contain: layout style;
    }

    .sb-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #9AA3B8;
      text-transform: uppercase;
    }

    .sb-match-code {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: clamp(16px, 1.8vw, 24px);
      margin-top: 4px;
      color: #F5F6F8;
    }

    .sb-timer-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      width: 100%;
    }

    .sb-timer {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--amber);
      line-height: 1;
      font-size: clamp(44px, 6.5vw, 96px);
      text-shadow: 0 0 28px rgba(245,197,24,0.45);
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      contain: layout style;
      white-space: nowrap;
    }

    .sb-timer--urgent {
      color: #EF4444;
      text-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
      animation: urgentPulse 0.5s ease infinite alternate;
    }

    @keyframes urgentPulse {
      from { opacity: 1; }
      to   { opacity: 0.6; }
    }

    /* Status Pill */
    .sb-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      white-space: nowrap;
      text-transform: uppercase;
      transition: all 200ms ease;
    }

    .sb-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }

    .sb-round-val {
      font-family: var(--font-body);
      font-weight: 800;
      font-size: clamp(20px, 2.2vw, 30px);
      margin-top: 4px;
    }

    .sb-event-sub {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: rgba(154,163,184,0.55);
      text-transform: uppercase;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Finished Overlay Banner */
    .sb-finished-banner {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      background: linear-gradient(90deg, #7A0F22, #C49B08, #0F2E7A);
      color: #FFFFFF;
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 0;
      z-index: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    /* ── Fullscreen button ─────────────────────────────────────────────────── */
    #fullscreen-btn {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 100;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      color: #F5F6F8;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.5;
      transition: opacity 0.2s, background 0.2s;
      min-height: 36px;
    }
    #fullscreen-btn:hover { opacity: 1; background: rgba(255,255,255,0.14); }

    /* ── Tablet / Portrait layout (max 900px) ─────────────────────────────── */
    @media (max-width: 900px) {
      body { overflow-y: auto; }

      .sb-root {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .sb-center {
        order: -1;
        width: 100%;
        min-width: unset;
        max-width: unset;
        flex: none;
        border-left: none;
        border-right: none;
        border-bottom: 1px solid rgba(255,255,255,0.08);
        padding: 20px 24px;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        gap: 16px;
      }

      .sb-timer-block { flex-direction: row; gap: 12px; padding: 0; }

      .sb-corner { padding: 28px 20px; }
      .sb-score  { font-size: clamp(56px, 18vw, 120px); }
      .sb-timer  { font-size: clamp(40px, 12vw, 72px); }
      .sb-name   { font-size: clamp(16px, 4vw, 32px); }
    }

    /* ── Mobile portrait (max 600px) ──────────────────────────────────────── */
    @media (max-width: 600px) {
      .sb-center {
        flex-direction: column;
        gap: 12px;
        padding: 16px;
      }
      .sb-timer-block { flex-direction: column; gap: 8px; }
      .sb-score  { font-size: clamp(52px, 22vw, 100px); }
      .sb-timer  { font-size: clamp(38px, 14vw, 64px); }
      .sb-name   { font-size: clamp(16px, 5vw, 28px); }
      .sb-gj-label { font-size: 10px; }
      .sb-gj-num { font-size: clamp(16px, 4vw, 24px); }
      .sb-badge  { font-size: 10px; padding: 4px 8px; }
      .sb-chip   { min-width: 28px; height: 24px; font-size: 10px; }
    }

    /* ── Landscape mobile (short screens) ─────────────────────────────────── */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      body { overflow: hidden; }
      .sb-root { flex-direction: row; height: 100vh; height: 100dvh; }
      .sb-center {
        order: 0;
        width: auto;
        min-width: clamp(180px, 20vw, 240px);
        max-width: clamp(180px, 20vw, 240px);
        flex: 0 0 clamp(180px, 20vw, 240px);
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        border-left: 1px solid rgba(255,255,255,0.08);
        border-right: 1px solid rgba(255,255,255,0.08);
        border-bottom: none;
        padding: 12px 10px;
      }
      .sb-timer-block { flex-direction: column; gap: 8px; }
      .sb-corner { padding: 16px 12px; }
      .sb-score  { font-size: clamp(48px, 10vw, 96px); }
      .sb-timer  { font-size: clamp(32px, 5.5vw, 64px); }
    }

    /* ── TV / Large display (> 1600px) ────────────────────────────────────── */
    @media (min-width: 1600px) {
      .sb-center {
        flex: 0 0 clamp(320px, 18vw, 400px);
        width: clamp(320px, 18vw, 400px);
        min-width: clamp(320px, 18vw, 400px);
        max-width: clamp(320px, 18vw, 400px);
      }
    }

    /* ── Waiting overlay ───────────────────────────────────────────────────── */
    #waiting-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #0B0D12;
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
  </style>
</head>
<body>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loading" role="status" aria-label="Loading scoreboard">
  <div class="spinner"></div>
</div>

<!-- Finished Banner -->
<div id="finished-banner" class="sb-finished-banner" role="alert" aria-live="polite">
  🏆 Match Complete
</div>

<div class="sb-root" id="scoreboard" role="main">

  <!-- 🔴 RED CORNER (Hong) -->
  <section class="sb-corner sb-corner--red" aria-label="Red Corner">
    <div class="sb-corner-top">
      <span class="sb-country-badge" id="sb-red-country" style="display:none;" aria-label="Red country"></span>
      <span class="sb-name" id="sb-red-name">Red Corner</span>
    </div>

    <div class="sb-corner-body">
      <div class="sb-score score-digits" id="sb-red-score" aria-live="polite" aria-label="Red score">00</div>

      <div class="sb-round-chips" id="sb-red-rounds" role="list" aria-label="Red round results">
        <span class="sb-chip" id="sb-red-r1" role="listitem">R1</span>
        <span class="sb-chip" id="sb-red-r2" role="listitem">R2</span>
        <span class="sb-chip" id="sb-red-r3" role="listitem">R3</span>
      </div>

      <div class="sb-badges">
        <span class="sb-badge" id="sb-red-vr">
          <span class="sb-badge-dot" aria-hidden="true"></span> VR QUOTA
        </span>
        <span class="sb-badge">
          <span class="sb-badge-dot" aria-hidden="true"></span> DOC TIMEOUT
        </span>
      </div>
    </div>

    <div class="sb-corner-bottom">
      <div class="sb-gj-box">
        <span class="sb-gj-label">GAM-JEOM</span>
        <span class="sb-gj-num" id="sb-red-gj-count" aria-live="polite" aria-label="Red Gam-jeom">0</span>
      </div>
    </div>
  </section>

  <!-- ⏱ CENTER COLUMN (Timer, Status, Round) -->
  <div class="sb-center">
    <div>
      <div class="sb-label">MATCH</div>
      <div class="sb-match-code" id="sb-match-code">M-201</div>
    </div>

    <div class="sb-timer-block">
      <div class="sb-timer timer-digits" id="sb-timer" aria-live="off" aria-label="Match timer">02:00</div>
      <div class="sb-status-pill" id="sb-status-pill">
        <span class="sb-status-dot" id="sb-status-dot" aria-hidden="true"></span>
        <span id="sb-status-text">LIVE</span>
      </div>
    </div>

    <div>
      <div class="sb-label">ROUND</div>
      <div class="sb-round-val" id="sb-round">
        <span id="sb-cur-round">1</span>
        <span style="color: #9AA3B8; font-weight: 600;">/</span>
        <span id="sb-total-rounds" style="color: #9AA3B8; font-weight: 600;">3</span>
      </div>
    </div>

    <div class="sb-event-sub" id="sb-event-sub">Taekwondo Scoring</div>
  </div>

  <!-- 🔵 BLUE CORNER (Chung) -->
  <section class="sb-corner sb-corner--blue" aria-label="Blue Corner">
    <div class="sb-corner-top">
      <span class="sb-name" id="sb-blue-name">Blue Corner</span>
      <span class="sb-country-badge" id="sb-blue-country" style="display:none;" aria-label="Blue country"></span>
    </div>

    <div class="sb-corner-body">
      <div class="sb-score score-digits" id="sb-blue-score" aria-live="polite" aria-label="Blue score">00</div>

      <div class="sb-round-chips" id="sb-blue-rounds" role="list" aria-label="Blue round results">
        <span class="sb-chip" id="sb-blue-r1" role="listitem">R1</span>
        <span class="sb-chip" id="sb-blue-r2" role="listitem">R2</span>
        <span class="sb-chip" id="sb-blue-r3" role="listitem">R3</span>
      </div>

      <div class="sb-badges">
        <span class="sb-badge" id="sb-blue-vr">
          <span class="sb-badge-dot" aria-hidden="true"></span> VR QUOTA
        </span>
        <span class="sb-badge">
          <span class="sb-badge-dot" aria-hidden="true"></span> DOC TIMEOUT
        </span>
      </div>
    </div>

    <div class="sb-corner-bottom">
      <div class="sb-gj-box">
        <span class="sb-gj-label">GAM-JEOM</span>
        <span class="sb-gj-num" id="sb-blue-gj-count" aria-live="polite" aria-label="Blue Gam-jeom">0</span>
      </div>
    </div>
  </section>

</div>

<!-- Floating Fullscreen Button -->
<button id="fullscreen-btn" title="Toggle Fullscreen (F)" aria-label="Toggle fullscreen">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
  Fullscreen
</button>

<!-- Waiting for Match Overlay -->
<div id="waiting-overlay">
  <div style="font-size: clamp(2.5rem, 8vw, 4rem); margin-bottom: 16px; filter: drop-shadow(0 0 24px rgba(245,197,24,0.4));" aria-hidden="true">🥋</div>
  <h1 style="font-family: var(--font-display); font-size: clamp(22px, 4vw, 48px); font-weight:800; letter-spacing:0.04em; margin-bottom: 12px; color:#F5F6F8;">TAEKWONDO SCOREBOARD</h1>
  <p id="waiting-sub" style="font-size: clamp(13px, 1.5vw, 18px); color: var(--text-muted); max-width: 520px; line-height: 1.5; margin-bottom: 24px;">Waiting for tournament operator to initialize match…</p>
  <div class="sb-status-pill" style="padding: 8px 18px; font-size:0.85rem; display:inline-flex; align-items:center; gap:8px;">
    <span class="sb-status-dot" style="background:#22c55e;" aria-hidden="true"></span> LIVE SYSTEM READY
  </div>
</div>

<script type="module" src="./scoreboard.js"></script>
</body>
</html>
